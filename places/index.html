<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mexicana: Mexico's states and cities quiz</title>
    <meta name="description" content="Map quizzes on modern Mexico: find and name its 32 states, their capitals, and its main cities." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L11 10 L17 19 L21 13 L30 26 Z' fill='%238a3b16'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="quiz-app">
      <aside id="panel" aria-label="States and cities quiz">
        <header class="panel-header">
          <div class="brand">
            <h1><a href="./">States and cities</a></h1>
            <p>A map quiz on modern Mexico</p>
          </div>
          <a class="icon-button" href="../quiz/" title="Flashcards and quizzes on each era">Quiz</a>
          <a class="icon-button" href="../" title="Back to the atlas">Atlas</a>
        </header>
        <div id="panel-body" class="panel-body">
          <div id="quiz" class="quiz-body"></div>
        </div>
      </aside>

      <main id="map-wrap">
        <div id="map" role="region" aria-label="Map"></div>
        <p id="map-hint" class="map-hint" hidden></p>
      </main>
    </div>

    <script type="module" src="/src/places/main.ts"></script>
  </body>
</html>
